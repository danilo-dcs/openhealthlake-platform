# This docker-compose file launches a standalone Self Hosted Lakehosue application
services:
  couchbase:
    image: lakehouse-couchbase
    hostname: couchbase
    container_name: couchbase
    ports:
      - 8091:8091 # couchbase admin client
      - 8092:8092 # couchbase query client
      - 8093:8093 # couchbase index service
      - 8094:8094 # couchbase query service
      - 11210:11210 # client data access
      - 18091:18091 # couchbase admin client https
    restart: always
    environment:
      COUCHBASE_ADMINISTRATOR_USERNAME: ${COUCHBASE_USER}
      COUCHBASE_ADMINISTRATOR_PASSWORD: ${COUCHBASE_PASSWORD}
    networks:
      - couchbase-network
      - app-network
    volumes:
      - couchbase-data:/opt/couchbase/var
      - ./couchbase/scripts:/scripts
    # entrypoint: ['bash', '/scripts/custom_entrypoint.sh']

  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
      MINIO_REGION_NAME: ${MINIO_REGION}
      MINIO_BROWSER: 'on'
    volumes:
      - ./minio-data:/data
      - ./minio-config:/root/.minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - minio-network

  passport-broker:
    container_name: lakehouse-passport-broker
    image: ga4gh/ga4gh-starter-kit-passport-broker:0.0.2
    ports:
      - 4501:4501
    volumes:
      # - $HOME/docker_volumes/passport_broker/config:/config
      - passport_usr_data:/usr
    networks:
      - app-network
      - minio-network

  backend:
    container_name: lakehouse-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      secrets:
        - cert_ca
    ports:
      - 4000:4000
    volumes:
      - ./.env:/app/.env
    networks:
      - app-network
    depends_on:
      - lakehouse-couchbase
      - lakehouse-passport-broker
    environment:
      BACKEND_ENV: ${BACKEND_ENV}              
      EMAIL_SERVICE_KEY: ${EMAIL_SERVICE_KEY}
      PASSPORT_BROKER_SERVICE_URL: ${PASSPORT_BROKER_SERVICE_URL}    
      COUCHBASE_HOST: ${COUCHBASE_HOST}
      COUCHBASE_USER: ${COUCHBASE_USER}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET}
      ENCRYPTION_SECRET_KET: ${ENCRYPTION_SECRET_KET}          
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}                
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY}              
      AUTH_ALGORITHM: ${AUTH_ALGORITHM}
      EXPIRATION_TIME_MINUTES: ${EXPIRATION_TIME_MINUTES}     
      FRONTEND_URL: ${FRONTEND_URL}                   
      DOCUMENTATION_URL: ${DOCUMENTATION_URL}

  frontend:
    build:
      context: ./frontend/lakehouse-ui/
      dockerfile: Dockerfile.prod
      secrets:
        - cert_ca
    container_name: lakehouse-frontend
    networks:
      app-network:
        aliases:
          - frontend.daniloapp.com

    depends_on:
      - lakehouse-backend
    expose:
      - '80'
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3

secrets:
  cert_ca:
    file: ${CA_CERT_PATH}

networks:
  app-network:
    driver: bridge
  couchbase-network:
    driver: bridge
  minio-network:
    driver: bridge

volumes:
  passport_usr_data:
    driver: local
  couchbase-data:
    driver: local

