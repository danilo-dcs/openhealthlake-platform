# This docker-compose file launches a standalone Self Hosted Lakehosue application
services:
  couchbase:
    image: couchbase
    hostname: couchbase
    container_name: ohl-couchbase
    ports:
      - 8091:8091 # couchbase admin client
      - 8092:8092 # couchbase query client
      - 8093:8093 # couchbase index service
      - 8094:8094 # couchbase query service
      - 11210:11210 # client data access
      - 18091:18091 # couchbase admin client https
    restart: always
    environment:
      COUCHBASE_ADMINISTRATOR_USERNAME: ${COUCHBASE_USER}
      COUCHBASE_ADMINISTRATOR_PASSWORD: ${COUCHBASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8091/pools >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ohl-couchbase-network
      - ohl-app-network
    volumes:
      - ohl-couchbase-data:/opt/couchbase/var

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: ohl-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_DOMAIN: minio
      MINIO_REGION_NAME: af-south-1
      MINIO_BROWSER: 'on'
    volumes:
      - ./minio-data:/data
      - ./minio-config:/root/.minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ohl-minio-network

  initialize-couchbase:
    image: alpine:3.20
    container_name: ohl-initialize-couchbase
    network_mode: service:couchbase
    depends_on:
      couchbase:
        condition: service_healthy
    environment:
      COUCHBASE_HOST: ohl-couchbase
      COUCHBASE_USER: ${COUCHBASE_USER}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET}
    volumes:
      - ./deploy/initialize_couchbase.sh:/scripts/initialize_couchbase.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache curl && exec /bin/sh /scripts/initialize_couchbase.sh"]
    restart: "no"

  initialize-minio:
    image: alpine:3.20
    container_name: initialize-minio
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: ohl-minio
      MINIO_PORT: 9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - ./deploy/initialize_minio.sh:/scripts/initialize_minio.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache minio-client && exec /bin/sh /scripts/initialize_minio.sh"]
    networks:
      - ohl-minio-network
    restart: "no"

  passport-broker:
    container_name: ohl-passport-broker
    image: ga4gh/ga4gh-starter-kit-passport-broker:0.0.2
    ports:
      - 4501:4501
    volumes:
      - ohl-passport_usr_data:/usr
    networks:
      - ohl-app-network
      - ohl-minio-network

  backend:
    container_name: ohl-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      secrets:
        - cert_ca
    ports:
      - 4000:4000
    volumes:
      - ./.env:/app/.env
    networks:
      - ohl-app-network
    depends_on:
      initialize-couchbase:
        condition: service_completed_successfully
      passport-broker:
        condition: service_started
    environment:
      BACKEND_ENV: ${BACKEND_ENV}              
      EMAIL_SERVICE_KEY: ${EMAIL_SERVICE_KEY}
      PASSPORT_BROKER_SERVICE_URL: ${PASSPORT_BROKER_SERVICE_URL}    
      COUCHBASE_HOST: ${COUCHBASE_HOST}
      COUCHBASE_USER: ${COUCHBASE_USER}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET}
      ENCRYPTION_SECRET_KET: ${ENCRYPTION_SECRET_KET}          
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}                
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY}              
      AUTH_ALGORITHM: ${AUTH_ALGORITHM}
      EXPIRATION_TIME_MINUTES: ${EXPIRATION_TIME_MINUTES}     
      FRONTEND_URL: ${FRONTEND_URL}                   
      DOCUMENTATION_URL: ${DOCUMENTATION_URL}              

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      secrets:
        - cert_ca
    container_name: ohl-frontend
    networks:
      ohl-app-network:
        aliases:
          - frontend.pathotrack.health

    depends_on:
      - backend
    expose:
      - '80'
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3

secrets:
  cert_ca:
    file: ${CA_CERT_PATH}

networks:
  ohl-app-network:
    driver: bridge
  ohl-couchbase-network:
    driver: bridge
  ohl-minio-network:
    driver: bridge

volumes:
  ohl-passport_usr_data:
    driver: local
  ohl-couchbase-data:
    driver: local

